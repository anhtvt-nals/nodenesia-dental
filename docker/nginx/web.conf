server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 15m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location ~ /\.(?!well-known(?:/|$)) {
    access_log off;
    log_not_found off;
    return 404;
  }

  location ~* ^/(?:wp-admin|wp-login\.php|xmlrpc\.php|phpmyadmin|pma|vendor|cgi-bin)(?:/|$) {
    access_log off;
    log_not_found off;
    return 404;
  }

  location ~* \.(?:bak|sql|sqlite|tar|tgz|gz|zip|pem|key|log)$ {
    access_log off;
    log_not_found off;
    return 404;
  }

  location ~ ^/api/docs(?:/|$|-json) {
    access_log off;
    return 404;
  }

  location = /api/v1/auth/login {
    limit_req zone=auth_per_ip burst=10 nodelay;
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~ ^/api/v1/public/bookings/[^/]+/status/stream$ {
    limit_req zone=api_per_ip burst=20 nodelay;
    limit_conn sse_per_ip 3;
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    chunked_transfer_encoding off;
  }

  location /api/ {
    limit_req zone=api_per_ip burst=60 nodelay;
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
