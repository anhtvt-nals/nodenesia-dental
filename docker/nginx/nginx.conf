user nginx;
worker_processes auto;
# /var/run is a dedicated tmpfs in Docker Compose.  /tmp belongs to the
# read-only root filesystem in the web/admin containers.
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  keepalive_timeout 65;

  # Web/admin containers only accept traffic from the local reverse proxy.
  # Restore the real client IP before applying per-IP limits.
  set_real_ip_from 127.0.0.1;
  set_real_ip_from 172.16.0.0/12;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=10r/m;
  limit_conn_zone $binary_remote_addr zone=sse_per_ip:10m;

  access_log /dev/stdout;
  error_log /dev/stderr warn;

  include /etc/nginx/conf.d/*.conf;
}
